name: M0001 validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  windows-native-aot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Record SDK and RID
        run: |
          dotnet --info
          dotnet --list-sdks
      - name: Focused and integration tests
        run: dotnet test --configuration Release
      - name: PackageReference consumer
        shell: pwsh
        run: ./scripts/validate-consumer.ps1
      - name: Publish Native AOT
        run: dotnet publish src/DotnetNugetContent/DotnetNugetContent.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Invoke native CLI and round-trip content
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/win-x64/dotnet-nuget-content.exe).Path
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Native --help failed.' }
          if ((& $exe --version) -ne '0.1.0') { throw 'Native --version did not return 0.1.0.' }
          $work = Join-Path $env:RUNNER_TEMP 'dnc-native-roundtrip'
          $source = Join-Path $work 'source'
          New-Item -ItemType Directory -Force -Path (Join-Path $source 'nested') | Out-Null
          $bytes = [byte[]](0, 255, 1, 128, 13, 10, 0, 42)
          $textBytes = [System.Text.Encoding]::UTF8.GetBytes('native round-trip')
          [System.IO.File]::WriteAllBytes((Join-Path $source 'nested/payload.bin'), $bytes)
          [System.IO.File]::WriteAllBytes((Join-Path $source 'nested/readme.txt'), $textBytes)
          & $exe pack --id dnc.native.validation --version 1.0.0 --source $source --output (Join-Path $work 'feed/dnc.native.validation.1.0.0.nupkg')
          if ($LASTEXITCODE -ne 0) { throw 'Native pack failed.' }
          & $exe unpack --package (Join-Path $work 'feed/dnc.native.validation.1.0.0.nupkg') --destination (Join-Path $work 'output')
          if ($LASTEXITCODE -ne 0) { throw 'Native unpack failed.' }
          if ([Convert]::ToHexString([System.IO.File]::ReadAllBytes((Join-Path $work 'output/nested/payload.bin'))) -ne [Convert]::ToHexString($bytes)) { throw 'Native binary round-trip differs.' }
          if ([Convert]::ToHexString([System.IO.File]::ReadAllBytes((Join-Path $work 'output/nested/readme.txt'))) -ne [Convert]::ToHexString($textBytes)) { throw 'Native text round-trip differs.' }
          Get-Item $exe | Select-Object FullName,Length
      - name: Upload Native AOT executable
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-nuget-content-win-x64
          path: artifacts/win-x64/dotnet-nuget-content.exe
